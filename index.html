<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Through Trash</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦝</text></svg>">
<meta name="description" content="One raccoon. One junkyard. Three gifts before sunrise.">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/title-mascot.css">
<style>
@media (max-width: 600px) {
  canvas { touch-action: pan-y pinch-zoom; user-select: none; -webkit-user-select: none; }
  .btn { min-height: 48px; }
  .row { min-height: 58px; }
  .actions { flex-direction: column; }
  .actions .btn { width: 100%; flex: 1 1 auto; }
  .overlay { padding: 10px; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .card { max-height: calc(100vh - 20px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
}
</style>
</head>
<body>
<div class="wrap" id="game-ui">
  <div class="top-ui">
    <div class="bubble title-bubble title-with-mascot">
      <div class="title-copy"><h1 class="glitter-title">Treasure Through Trash</h1><div class="made-with-ai">Made with AI</div></div>
      <span class="title-raccoon" role="img" aria-label="Raccoon mascot">🦝</span>
    </div>
    <div class="bubble creator-bubble"><span>One raccoon. One junkyard. Three nights before the run is over.</span></div>
  </div>

  <div class="bubble round-bar" id="roundBar"></div>

  <div class="stage">
    <div class="game-stats" aria-label="Game stats">
      <div class="stat-box time-stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timeValue">7:00 PM</div>
        <div class="stat-subvalue" id="hoursLeftValue">12 hours left until 7:00 AM</div>
      </div>
    </div>
    <canvas id="game" width="900" height="550" aria-label="Junkyard. Tap trash to dig."></canvas>
  </div>

  <div class="bubble" id="status"></div>

  <div class="panels">
    <div class="bubble panel">
      <h2 id="knowTitle">What you know</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="bubble panel">
      <h2 id="shelfTitle">Gift shelf</h2>
      <p class="hint" id="shelfHint"></p>
      <div class="shelf" id="shelf"></div>
      <div class="actions">
        <button class="btn" id="wrapBtn" disabled>🎁 Wrap it</button>
        <button class="btn alt" id="pebbleBtn">Just give 6 pebbles</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="js/main.js?v=first-dig-fix-20260923"></script>
</body>
</html>
