<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Through Trash</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦝</text></svg>">
<meta name="description" content="One raccoon. One junkyard. Three gifts before sunrise.">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #222; }
  body {
    color: #2c2418;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    position: relative;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 960px; margin: 16px auto 40px; padding: 0 12px; position: relative; z-index: 2; }

  /* ---------- pink glitter (from the base game) ---------- */
  .pink-star, .bubble-star, .menu-star {
    position: absolute; pointer-events: none; color: #ffb6d9; line-height: 1;
    text-shadow: 0 0 7px rgba(255,182,217,.95), 0 0 14px rgba(255,182,217,.55);
    opacity: var(--opacity); transform: rotate(var(--rot)) scale(var(--scale));
    animation: twinkle var(--speed) infinite alternate ease-in-out;
  }
  .pink-star { position: fixed; z-index: 0; }
  .bubble-star { z-index: 1; }
  @keyframes twinkle { from { opacity: .28; filter: brightness(.9); transform: rotate(var(--rot)) scale(calc(var(--scale) * .72)); } to { opacity: 1; filter: brightness(1.5); transform: rotate(var(--rot)) scale(calc(var(--scale) * 1.28)); } }

  .bubble {
    background: #efe5c7; color: #2c2418; border: 3px solid #4d4336; border-radius: 24px;
    box-shadow: 0 4px 0 rgba(0,0,0,.25); position: relative; overflow: hidden;
  }
  .bubble > *:not(.bubble-star) { position: relative; z-index: 2; }

  .glitter-title {
    margin: 0; font-family: "Brush Script MT", "Segoe Script", "Comic Sans MS", cursive;
    font-weight: 900; font-style: italic; line-height: .95; letter-spacing: 1.5px; color: #ffb6d9;
    background: linear-gradient(180deg,#fff4fb 0%,#ffd1e6 24%,#ff9fca 52%,#ff6fb3 74%,#fff1f8 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgba(126,54,92,.75);
    text-shadow: 0 1px 0 #fff, 0 2px 0 #ff9dca, 0 3px 0 #d85f9a, 0 0 5px rgba(255,255,255,.95), 0 0 10px rgba(255,182,217,.95), 0 0 18px rgba(255,105,180,.8), 2px 3px 0 rgba(78,38,58,.35);
    transform: rotate(-1.5deg) scaleX(1.05); filter: drop-shadow(0 0 5px rgba(255,182,217,.85));
  }

  /* ---------- top bar ---------- */
  .top-ui { display: flex; justify-content: center; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .title-bubble { padding: 12px 22px 10px; text-align: center; flex: 1 1 320px; max-width: 600px; }
  .title-bubble h1 { font-size: clamp(30px, 6vw, 46px); }
  .made-with-ai { margin-top: 6px; font-size: 13px; font-weight: 700; color: #5d5241; }
  .creator-bubble { padding: 12px 16px; font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; flex: 0 1 220px; }

  .round-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 10px; }
  .round-bar .who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .round-bar .who > div { min-width: 0; flex: 1; }
  .round-bar .who img { width: 46px; height: 36px; object-fit: contain; flex: none; }
  .round-bar .who b { display: block; font-size: 16px; }
  .round-bar .who span { font-size: 13px; color: #5d5241; }
  .paws { font-size: 13px; font-weight: 700; color: #5d5241; text-align: right; flex: none; }
  .paws .p { font-size: 18px; letter-spacing: 1px; display: block; }
  .paws .p i { font-style: normal; opacity: .22; }
  @media (max-width: 520px) {
    .paws .p { font-size: 13px; letter-spacing: 0; }
    .round-bar .who b { font-size: 14px; }
    .creator-bubble { flex-basis: 100%; padding: 8px 12px; }
    .title-bubble { padding: 10px 14px 8px; }
  }

  /* ---------- combined HUD stats ---------- */
  .game-stats {
    position: absolute; top: 12px; right: 12px; z-index: 8; display: flex; gap: 8px; align-items: stretch;
    pointer-events: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stat-box {
    min-width: 142px; padding: 9px 11px; border: 2px solid rgba(255,214,232,.9); border-radius: 14px;
    background: rgba(31,27,31,.88); color: #fff4fa; box-shadow: 0 3px 0 rgba(0,0,0,.38), 0 0 10px rgba(255,182,217,.28);
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  .stat-label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .8px; color: #ffb6d9; margin-bottom: 4px; }
  .stat-value { font-size: 17px; font-weight: 900; line-height: 1.05; }
  .stat-subvalue { margin-top: 4px; font-size: 11px; font-weight: 700; color: #eadde4; }
  .load-bar { width: 100%; height: 8px; margin-top: 7px; overflow: hidden; border-radius: 999px; border: 1px solid rgba(255,220,235,.7); background: rgba(255,255,255,.13); }
  .load-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg,#ffb6d9,#ff75b8); }
  @media (max-width: 680px) {
    .game-stats { top: 8px; right: 8px; gap: 5px; transform: scale(.78); transform-origin: top right; }
    .stat-box { min-width: 130px; }
  }

  /* ---------- stage ---------- */
  .stage { position: relative; }
  canvas {
    width: 100%; height: auto; display: block; border: 4px solid #111; border-radius: 6px;
    background: #71624f; cursor: pointer; touch-action: manipulation;
  }
  .player {
    position: absolute; left: 10px; top: 10px; width: clamp(64px, 15%, 140px);
    background: rgba(20,20,20,.62); border: 2px solid #555; border-radius: 10px; padding: 5px;
    pointer-events: none; color: #fff; text-align: center;
  }
  .player img { width: 100%; display: block; }
  .player div { font-weight: 700; font-size: clamp(10px, 1.6vw, 13px); margin-top: 2px; }

  #status { margin: 10px 0; padding: 10px 14px; min-height: 48px; text-align: center; font-size: 15px; line-height: 1.4; }
  #status .found-name { font-weight: 800; }
  #status.clue { background: #d9efe9; border-color: #2f6b5f; }
  #status.gift { background: #fbe7c8; }

  /* ---------- panels ---------- */
  .panels { display: grid; grid-template-columns: 1fr 1.35fr; gap: 10px; }
  @media (max-width: 720px) { .panels { grid-template-columns: 1fr; } }
  .panel { padding: 12px 14px 14px; }
  .panel h2 { margin: 0 0 8px; font-size: 17px; }
  .panel .hint { font-size: 13px; color: #6d6150; margin: 0 0 8px; line-height: 1.35; }
  .chips { display: flex; flex-direction: column; gap: 6px; }
  .chip { background: #fff8e6; border: 2px solid #b9a77f; border-radius: 12px; padding: 7px 10px; font-size: 14px; line-height: 1.3; }
  .chip.new { animation: pop .5s ease; border-color: #2f6b5f; background: #e2f4ee; }
  .chip.empty { color: #857761; font-style: italic; border-style: dashed; }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .shelf { display: flex; flex-direction: column; gap: 6px; }
  .row {
    appearance: none; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 8px;
    background: #fff8e6; border: 2px solid #b9a77f; border-radius: 14px; padding: 7px 10px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .row:hover { transform: translateY(-1px); border-color: #d85f9a; }
  .row.sel { border-color: #d85f9a; background: #ffe3f0; box-shadow: 0 0 0 3px rgba(255,150,200,.35); }
  .row .em { font-size: 28px; text-align: center; }
  .row .nm { font-weight: 700; font-size: 14px; }
  .row .bar { height: 9px; background: #e4d7b4; border-radius: 9px; margin-top: 5px; overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: linear-gradient(90deg,#ff9fca,#d85f9a); border-radius: 9px; transition: width .5s ease; }
  .row .nums { text-align: right; font-size: 12px; color: #5d5241; line-height: 1.35; white-space: nowrap; }
  .row .nums b { font-size: 15px; color: #2c2418; }
  .delta { font-weight: 800; font-size: 12px; margin-left: 4px; }
  .delta.up { color: #1f7a4d; } .delta.down { color: #b0304a; }
  .row.moved { animation: pop .5s ease; }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 3px solid #fff0f7; border-radius: 999px; padding: 12px 20px; cursor: pointer;
    font: 900 16px/1 system-ui, sans-serif; letter-spacing: .5px; color: #54223d;
    background: linear-gradient(180deg,#ffeaf4 0%,#ffb6d9 44%,#ff8fc3 100%);
    box-shadow: 0 0 14px rgba(255,182,217,.7), 0 5px 0 #a84e7c; transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 10px rgba(255,182,217,.6), 0 1px 0 #a84e7c; }
  .btn[disabled] { filter: grayscale(.8) opacity(.55); cursor: not-allowed; transform: none; }
  .btn.alt { background: linear-gradient(180deg,#fdf6e3,#e9dcb8); color: #4d4336; border-color: #fffaf0; box-shadow: 0 5px 0 #8a7b5c; }
  .btn.big { font-size: 20px; padding: 16px 30px; }
  .actions .btn { flex: 1 1 180px; }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(14,11,15,.9); backdrop-filter: blur(6px); overflow-y: auto;
    transition: opacity .25s ease;
  }
  .overlay.hide { opacity: 0; pointer-events: none; }
  .card {
    width: min(640px, 100%); margin: auto; padding: 30px 26px 26px; border: 4px solid #ffb6d9; border-radius: 34px;
    background: linear-gradient(180deg,rgba(56,38,52,.98),rgba(26,21,27,.98)); color: #f3eadf; text-align: center;
    box-shadow: 0 0 0 6px rgba(255,182,217,.14), 0 0 35px rgba(255,128,190,.5), 0 18px 45px rgba(0,0,0,.6);
    position: relative; overflow: hidden;
  }
  .card > *:not(.menu-star) { position: relative; z-index: 2; }
  .card .glitter-title { font-size: clamp(38px, 9vw, 64px); margin-bottom: 14px; }
  .card h3 { font-size: 22px; margin: 6px 0 10px; color: #ffe5f1; }
  .card p { font-size: 16px; line-height: 1.55; margin: 8px auto; max-width: 520px; }
  .how-to-body, .end-night-body { font-family: Arial, Helvetica, sans-serif; }
  .card .small { font-size: 13px; color: #cdbfb5; }
  .card .btn { margin-top: 16px; }
  .portrait { width: 150px; margin: 0 auto 4px; position: relative; }
  .portrait img { width: 100%; display: block; }
  .portrait .acc { position: absolute; font-size: 40px; }

  .quote { font-size: 19px; font-style: italic; color: #ffe5f1; margin: 8px 0 14px; }

  /* gift tag */
  .tag {
    display: inline-block; position: relative; margin: 6px auto 12px; padding: 16px 26px 14px 38px; min-width: 250px;
    background: #efe5c7; color: #2c2418; border: 3px solid #4d4336; border-radius: 10px 22px 22px 10px;
    text-align: left; transform: rotate(-2deg); box-shadow: 0 6px 0 rgba(0,0,0,.3);
    animation: swing 1.2s ease;
  }
  .tag::before { content: ""; position: absolute; left: 12px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #3a2d3a; box-shadow: 0 0 0 3px #b9a77f; }
  @keyframes swing { 0% { transform: rotate(-14deg) translateY(-20px); opacity: 0; } 50% { transform: rotate(4deg); opacity: 1; } 75% { transform: rotate(-4deg); } 100% { transform: rotate(-2deg); } }
  .tag .gift { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .tag .paid { font-size: 15px; }
  .tag .paid s { text-decoration-thickness: 2px; text-decoration-color: #b0304a; }
  .tag .worth { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; font-size: 21px; color: #7a2c55; margin-top: 4px; transform: rotate(-3deg); }
  .gapline { font-size: 17px; font-weight: 800; margin: 4px 0 6px; }
  .gapline.loss { color: #ff9fb5; } .gapline.gain { color: #9cf0c4; } .gapline.even { color: #ffe5f1; }
  .hearts { font-size: 24px; letter-spacing: 3px; margin: 2px 0 10px; }
  .hearts i { font-style: normal; opacity: .25; filter: grayscale(1); }

  .why { text-align: left; background: rgba(255,255,255,.06); border: 2px solid rgba(255,182,217,.35); border-radius: 16px; padding: 10px 14px; margin: 10px auto 0; max-width: 520px; }
  .why b { color: #ffe5f1; }
  .why ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .why li { font-size: 14.5px; line-height: 1.4; padding: 5px 0; border-top: 1px dashed rgba(255,182,217,.2); }
  .why li:first-child { border-top: 0; }
  .why .k { color: #9cf0c4; } .why .u { color: #ff9fb5; } .why .s { color: #ffd98a; }

  /* end screen */
  .tags3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .mini { background: #efe5c7; color: #2c2418; border: 3px solid #4d4336; border-radius: 16px; padding: 10px 6px; font-size: 13px; }
  .mini .em { font-size: 28px; }
  .mini .who { font-weight: 800; font-size: 13px; }
  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 90px; margin: 8px 0 4px; }
  .bars div { width: 22px; border-radius: 6px 6px 2px 2px; position: relative; }
  .bars .c { background: #8a7b5c; } .bars .v { background: #d85f9a; }
  .bars span { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 800; }
  .legend { font-size: 12.5px; color: #cdbfb5; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin: 0 4px 0 10px; }
  .tally { font-size: 17px; line-height: 1.6; }
  .tally b { color: #ffe5f1; font-size: 20px; }
  .finale { font-size: 20px; font-style: italic; color: #ffe5f1; margin: 12px 0 4px; }
  details { margin-top: 16px; text-align: left; background: rgba(255,255,255,.06); border-radius: 16px; padding: 10px 14px; border: 2px solid rgba(255,182,217,.3); }
  summary { cursor: pointer; font-weight: 800; color: #ffe5f1; }
  details p { font-size: 14.5px; }
  @media (max-width: 480px) {
    .card { padding: 24px 16px 20px; border-radius: 26px; }
    .tags3 { gap: 6px; }
    .bars div { width: 16px; }
  }
</style>
</head>
<body>

<div class="wrap" id="game-ui">
  <div class="top-ui">
    <div class="bubble title-bubble"><h1 class="glitter-title">Treasure Through Trash</h1><div class="made-with-ai">Made with AI</div></div>
    <div class="bubble creator-bubble"><span>Tagline Here</span></div>
  </div>

  <div class="bubble round-bar" id="roundBar"></div>

  <div class="stage">
    <div class="game-stats" aria-label="Game stats">
      <div class="stat-box carry-stat">
        <div class="stat-label">Carry Load Left</div>
        <div class="stat-value">0/30 Pounds</div>
        <div class="load-bar" aria-hidden="true"><div class="load-bar-fill"></div></div>
      </div>
      <div class="stat-box time-stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timeValue">7:00 PM</div>
        <div class="stat-subvalue" id="hoursLeftValue">12 hours left until 7:00 AM</div>
      </div>
    </div>
    <canvas id="game" width="900" height="550" aria-label="Junkyard. Tap trash to dig."></canvas>
    <div class="player"><img src="raccoon.png" alt="You, a raccoon"><div>You</div></div>
  </div>

  <div class="bubble" id="status"></div>

  <div class="panels">
    <div class="bubble panel">
      <h2 id="knowTitle">What you know</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="bubble panel">
      <h2 id="shelfTitle">Gift shelf</h2>
      <p class="hint" id="shelfHint"></p>
      <div class="shelf" id="shelf"></div>
      <div class="actions">
        <button class="btn" id="wrapBtn" disabled>🎁 Wrap it</button>
        <button class="btn alt" id="pebbleBtn">Just give 6 pebbles</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
const ITEMS = {
  spoon:{e:"🥄",n:"Shiny spoon",p:7,tags:["shiny"]}, key:{e:"🔑",n:"Brass key",p:5,tags:["shiny","key"]}, ring:{e:"💍",n:"Soda-tab ring",p:8,tags:["shiny"]}, bell:{e:"🔔",n:"Little bell",p:4,tags:["shiny","music"]}, burrito:{e:"🌯",n:"Half a burrito",p:6,tags:["food","perishable"]}, donut:{e:"🍩",n:"Sprinkle donut",p:5,tags:["food","perishable"]}, pizza:{e:"🍕",n:"Pizza crust",p:3,tags:["food","perishable"]}, sock:{e:"🧦",n:"Wool sock",p:3,tags:["warm","soft"]}, yarn:{e:"🧶",n:"Ball of yarn",p:4,tags:["warm","soft"]}, teddy:{e:"🧸",n:"Big teddy bear",p:7,tags:["big","soft"]}, radio:{e:"📻",n:"Crackly radio",p:8,tags:["big","music"]}, comic:{e:"📖",n:"Soggy comic",p:4,tags:["paper"]}, umbrella:{e:"☂️",n:"Umbrella",p:5,tags:["big"]}, candle:{e:"🕯️",n:"Candle stub",p:3,tags:["warm"]}
};
const FACTORS={
 hoard:{clue:{e:"📝",n:"a scribbled note",t:"“Found ANOTHER spoon today. Where am I supposed to PUT all these shiny things?” — {X}"},know:"{X} already has way too many shiny things",eff:(it)=>has(it,"shiny")?.35:1,hits:["shiny"]},
 tiny:{clue:{e:"📦",n:"a flattened moving box",t:"Scrawled on the side: “{X}’s NEW DEN — tiny but cozy!”"},know:"{X}’s new den is tiny",eff:(it)=>has(it,"big")?.3:1,hits:["big"]},
 cold:{clue:{e:"🌨️",n:"a soggy weather flyer",t:"“FROST WARNING all week.” Brr."},know:"A cold snap is coming",eff:(it,s)=>has(it,"warm")?(s.has("bare")?2.2:1.3):1,hits:["warm"]},
 bare:{clue:{e:"🪹",n:"a torn-up nest lining",t:"Label says: “{X}’s bedding.” It’s shredded. {X} is sleeping on bare dirt."},know:"{X} has no bedding right now",eff:(it,s)=>has(it,"soft")&&!s.has("cold")?1.3:1,hits:["soft"]},
 stuffed:{clue:{e:"🧾",n:"a bakery receipt",t:"“12 day-old croissants” — with {X}’s pawprint on it. Somebody ate well this week."},know:"{X} just had a huge feast",eff:(it)=>has(it,"food")?.4:1,hits:["food"]},
 travel:{clue:{e:"🗺️",n:"a chewed-up map",t:"A route is circled. Note: “{X} leaves at dawn — back in a week.”"},know:"{X} leaves town tomorrow for a week",eff:(it)=>has(it,"perishable")?.15:(has(it,"big")?.6:1),hits:["perishable","big"]},
 music:{clue:{e:"🎧",n:"a broken headphone",t:"Scratched into it: “can’t sleep without tunes” — {X}"},know:"{X} loves music",eff:(it)=>has(it,"music")?2.2:1,hits:["music"]},
 keys:{clue:{e:"⛓️",n:"a jangly key ring",t:"Twenty keys. None of them open anything. It’s {X}’s collection."},know:"{X} collects keys",eff:(it)=>has(it,"key")?2.6:1,hits:["key"]},
 reader:{clue:{e:"🔖",n:"a chewed bookmark",t:"“Property of {X}. Finished it in one night. AGAIN.”"},know:"{X} reads everything",eff:(it)=>has(it,"paper")?2.2:1,hits:["paper"]}
};
const VAGUE={e:"💌",n:"an old birthday card",t:"“To my dear little one — look how you’ve grown!” That’s… everything you know about her."};
const JUNK=[{e:"🍌",n:"a banana peel",t:"Just a banana peel. Slippery. Useless."},{e:"📰",n:"a wet newspaper",t:"Soggy newspaper. Can’t read a word."},{e:"🥫",n:"an empty can",t:"An empty can. Licked clean by someone else."},{e:"🧻",n:"a paper towel tube",t:"A cardboard tube. You look through it. Nothing."},{e:"🦴",n:"a chicken bone",t:"A chicken bone. Picked bare."}];
const FRIENDS=[
{name:"Pip",role:"your best friend",intro:"You and Pip have shared a dumpster since you were kits. If anyone can find Pip the perfect gift, it’s you.",clues:3,vague:false,junk:0,digs:6,taste:[.8,1.25],pebbleHearts:1,filter:"none",acc:"",pebbleLine:"“Pebbles? From YOU? …Oh. Okay. Thanks.”"},
{name:"Nib",role:"your cousin",intro:"You see Nib at family gatherings. You know… some stuff. Probably.",clues:1,vague:false,junk:2,digs:5,taste:[.6,1.5],pebbleHearts:1,filter:"hue-rotate(30deg) saturate(1.4) brightness(1.05)",acc:"🧢",pebbleLine:"“Cool. Pebbles. …Thanks, I guess.”"},
{name:"Great-Aunt Marlo",short:"Marlo",role:"your great-aunt",intro:"You met Great-Aunt Marlo once. She pinched your cheek and called you by your cousin’s name.",clues:0,vague:true,junk:2,digs:5,taste:[.4,1.8],pebbleHearts:2,filter:"grayscale(.85) sepia(.35) brightness(1.1)",acc:"👓",pebbleLine:"“Pebbles! How sensible, dear. I’ll pick something out myself.”"}
];
const PEBBLES=6;
const SPOTS=[{x:40,y:336,w:132,h:142,t:"bag"},{x:250,y:296,w:84,h:62,t:"box"},{x:196,y:404,w:112,h:82,t:"box"},{x:345,y:318,w:58,h:90,t:"can"},{x:425,y:340,w:132,h:142,t:"bag"},{x:580,y:300,w:60,h:97,t:"can"},{x:650,y:398,w:112,h:86,t:"box"},{x:776,y:330,w:104,h:134,t:"bag"}];
function has(it,t){return it.tags.includes(t)} function pick(a){return a[Math.floor(Math.random()*a.length)]} function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} function $(id){return document.getElementById(id)} function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))} function fill(s,fr){return s.replaceAll("{X}",fr.short||fr.name)}
function valueOf(id,set,taste){const it=ITEMS[id];let m=1;set.forEach(f=>m*=FACTORS[f].eff(it,set));if(taste&&taste.item===id)m*=taste.mult;return Math.max(0,Math.round(it.p*m))}
let elapsedGameHours=0,endNightShown=false,S=null,overlayOpen=false;
function formatGameTime(h){h=((h%24)+24)%24;return `${h%12||12}:00 ${h>=12?"PM":"AM"}`}
function renderTimeStat(){if(!$("timeValue"))return;$("timeValue").textContent=formatGameTime(19+elapsedGameHours);const l=Math.max(0,12-elapsedGameHours);$("hoursLeftValue").textContent=`${l} ${l===1?"hour":"hours"} left until 7:00 AM`}
function showEndOfNight(){if(endNightShown)return;endNightShown=true;openCard(`<div class="glitter-title" style="font-size:clamp(38px,9vw,64px)">End of Night</div><p class="end-night-body">The night has ended. Your run through the dump is complete.</p>`,52)}
function advanceGameTime(){if(endNightShown)return;elapsedGameHours+=2;renderTimeStat();if(elapsedGameHours>=12)showEndOfNight()}
function newGame(){elapsedGameHours=0;endNightShown=false;renderTimeStat();S={round:0,results:[]};setupRound()}
function setupRound(){const fr=FRIENDS[S.round];let factors=S.round===0?["cold","bare",pick(Object.keys(FACTORS).filter(f=>f!=="cold"&&f!=="bare"))]:shuffle(Object.keys(FACTORS)).slice(0,3);const gifts=[];factors.forEach(f=>{const c=shuffle(Object.keys(ITEMS)).filter(id=>!gifts.includes(id)&&FACTORS[f].hits.some(h=>has(ITEMS[id],h)));if(c.length)gifts.push(c[0])});shuffle(Object.keys(ITEMS)).forEach(id=>{if(gifts.length<5&&!gifts.includes(id))gifts.push(id)});const tiles=gifts.map(id=>({kind:"gift",id}));shuffle(factors).slice(0,fr.clues).forEach(f=>tiles.push({kind:"clue",f}));if(fr.vague)tiles.push({kind:"vague"});shuffle(JUNK).slice(0,fr.junk).forEach(j=>tiles.push({kind:"junk",j}));S.fr=fr;S.factors=new Set(factors);S.taste={item:pick(gifts),mult:1};S.tiles=shuffle(tiles).map((t,i)=>Object.assign(t,SPOTS[i],{open:false,openedAt:0}));S.known=new Set;S.found=[];S.digs=fr.digs;S.sel=null;S.lastDelta={};S.newChip=null;setStatus(`Tap a pile of trash to dig through it. You’ve got <b>${fr.digs} digs</b> before sunrise.`,"");renderUI();showIntro()}
function estimate(id){return valueOf(id,S.known,null)} function trueValue(id){return valueOf(id,S.factors,S.taste)}
function dig(tile){if(tile.open||S.digs<=0||overlayOpen)return;tile.open=true;tile.openedAt=performance.now();S.digs--;advanceGameTime();const fr=S.fr,X=fr.short||fr.name;S.lastDelta={};S.newChip=null;let msg="",cls="";if(tile.kind==="gift"){const it=ITEMS[tile.id];S.found.push(tile.id);msg=`${it.e} You found a <span class="found-name">${it.n.toLowerCase()}</span>. Grabbing it would cost you <b>${it.p} pebbles</b> of effort.`;cls="gift"}else if(tile.kind==="clue"){const f=FACTORS[tile.f];S.known.add(tile.f);S.newChip=tile.f;msg=`${f.clue.e} You found <span class="found-name">${f.clue.n}</span>. ${esc(fill(f.clue.t,fr))}`;cls="clue"}else if(tile.kind==="vague"){msg=`${VAGUE.e} ${VAGUE.t}`;cls="clue"}else msg=`${tile.j.e} ${tile.j.t}`;setStatus(msg,cls);renderUI()}
function setStatus(html,cls){const el=$("status");el.className="bubble"+(cls?" "+cls:"");el.innerHTML=html;addBubbleStars(el,8)}
function friendImg(fr){return `<img src="raccoon.png" alt="${esc(fr.name)}" style="filter:${fr.filter};transform:scaleX(-1)">`}
function renderUI(){const fr=S.fr,X=fr.short||fr.name;$("roundBar").innerHTML=`<div class="who">${friendImg(fr)}<div><b>Gift ${S.round+1} of 3 — for ${esc(fr.name)}</b><span>${esc(fr.role)}</span></div></div><div class="paws"><span class="p">${"🐾".repeat(S.digs)}</span>digs left</div>`;$("knowTitle").textContent=`What you know about ${X}`;$("chips").innerHTML=[...S.known].map(f=>`<div class="chip">${FACTORS[f].clue.e} ${esc(fill(FACTORS[f].know,fr))}</div>`).join("")||`<div class="chip empty">Nothing yet. Keep digging.</div>`;$("shelf").innerHTML=S.found.map(id=>`<button class="row" data-id="${id}"><span class="em">${ITEMS[id].e}</span><span><span class="nm">${esc(ITEMS[id].n)}</span></span><span class="nums">worth ~${estimate(id)}</span></button>`).join("");$("shelf").querySelectorAll(".row").forEach(b=>b.onclick=()=>{S.sel=b.dataset.id;renderUI()});$("wrapBtn").disabled=!S.sel;addBubbleStars($("roundBar"),6)}
function give(kind){const fr=S.fr,X=fr.short||fr.name;let r;if(kind==="pebbles")r={short:X,kind,e:"🪨",n:`${PEBBLES} pebbles`,cost:PEBBLES,worth:PEBBLES,hearts:fr.pebbleHearts,line:fr.pebbleLine,why:[]};else{const id=S.sel,it=ITEMS[id],v=trueValue(id);r={short:X,kind,id,e:it.e,n:it.n,cost:it.p,worth:v,hearts:v>=7?3:v>=4?2:1,line:"Thank you!",why:[]}}S.results.push(r);showReveal(r)}
function makeStar(cls,min,range){const s=document.createElement("span");s.className=cls;s.textContent=pick(["✦","✧","★","⋆"]);s.style.left=(2+Math.random()*96)+"%";s.style.top=(4+Math.random()*92)+"%";s.style.fontSize=(min+Math.random()*range)+"px";s.style.setProperty("--speed",(.45+Math.random()*1.3)+"s");s.style.setProperty("--opacity",(.4+Math.random()*.55).toFixed(2));s.style.setProperty("--rot",Math.floor(Math.random()*360)+"deg");s.style.setProperty("--scale",(.7+Math.random()*.9).toFixed(2));return s}
function addBubbleStars(el,n){el.querySelectorAll(":scope > .bubble-star").forEach(s=>s.remove());for(let i=0;i<n;i++)el.appendChild(makeStar("bubble-star",7,9))}
function openCard(html,stars=36){const c=$("card");c.innerHTML=html;for(let i=0;i<stars;i++)c.appendChild(makeStar("menu-star",9,22));$("overlay").classList.remove("hide");overlayOpen=true;c.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>GO[b.dataset.go]())}
function closeCard(){$("overlay").classList.add("hide");overlayOpen=false}
function showTitle(){openCard(`<div class="glitter-title">Treasure Through Trash</div><p>One raccoon. One junkyard. <b>Three gifts before sunrise.</b></p><button class="btn big" data-go="how">▶ PLAY</button>`,52)}
function showHow(){openCard(`<div class="glitter-title">How to Play</div><p class="how-to-body">Dig through the junkyard, find clues and gifts, then choose what to give.</p><button class="btn big" data-go="start">START GAME</button>`,52)}
function showIntro(){openCard(`<h3>Gift ${S.round+1} of 3: ${esc(S.fr.name)}</h3><p>${esc(S.fr.intro)}</p><button class="btn big" data-go="close">Start digging</button>`,30)}
function showReveal(r){openCard(`<div class="quote">${esc(r.line)}</div><div class="tag"><div class="gift">${r.e} ${esc(r.n)}</div><div class="paid">You paid: ${r.cost}</div><div class="worth">worth to me: ${r.worth}</div></div><button class="btn big" data-go="${S.round===2?"end":"next"}">${S.round===2?"See the night’s tally":"Next gift →"}</button>`,26)}
function showEnd(){openCard(`<div class="glitter-title">Sunrise.</div><p class="tally">Night complete.</p><button class="btn big" data-go="again">↻ Dig again</button>`,40)}
const GO={how:showHow,start:()=>{closeCard();newGame()},close:closeCard,next:()=>{S.round++;setupRound()},end:showEnd,again:()=>{closeCard();newGame()}};
$("wrapBtn").onclick=()=>{if(S.sel)give("gift")};$("pebbleBtn").onclick=()=>give("pebbles");
function scatterBackgroundStars(){document.querySelectorAll(".pink-star").forEach(n=>n.remove());for(let i=0;i<80;i++){const s=makeStar("pink-star",8,14);s.style.left=Math.random()*innerWidth+"px";s.style.top=Math.random()*innerHeight+"px";document.body.appendChild(s)}}
document.querySelectorAll(".title-bubble,.creator-bubble,.panel").forEach(el=>addBubbleStars(el,12));scatterBackgroundStars();
const canvas=$("game"),ctx=canvas.getContext("2d");let mouse={x:-100,y:-100},touchMode=false;
function rectHit(o){return mouse.x>=o.x&&mouse.x<=o.x+o.w&&mouse.y>=o.y&&mouse.y<=o.y+o.h}
function drawCircle(x,y,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,215);g.addColorStop(0,"#1c1b2e");g.addColorStop(.7,"#3b3346");g.addColorStop(1,"#6b5a63");ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,215);drawCircle(820,60,26,"#f6ecd0")}
function drawBuildings(){[[0,170,95,45],[130,140,80,75],[245,175,135,40],[420,145,95,70],[560,182,115,33],[710,150,70,65],[810,130,90,85]].forEach(([x,y,w,h])=>{ctx.fillStyle="#3f3a40";ctx.fillRect(x,y,w,h)})}
function drawFence(){const topY=225,bottomY=330;ctx.strokeStyle="#5b6266";ctx.lineWidth=2;for(let x=0;x<=canvas.width;x+=34){ctx.beginPath();ctx.moveTo(x,topY);ctx.lineTo(x,bottomY);ctx.stroke()}}
function drawStreetlight(x,baseY,h){ctx.strokeStyle="#44484c";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x+6,baseY-h);ctx.stroke()}
function drawPile(x,y,w,h){ctx.fillStyle="#5a5347";ctx.beginPath();ctx.moveTo(x,y+h);ctx.quadraticCurveTo(x+w*.15,y+h*.18,x+w*.45,y+h*.32);ctx.quadraticCurveTo(x+w*.74,y-h*.1,x+w,y+h);ctx.closePath();ctx.fill()}
function drawBackground(){drawSky();ctx.fillStyle="#71624f";ctx.fillRect(0,215,canvas.width,335);drawBuildings();drawStreetlight(90,285,92);drawStreetlight(350,280,106);drawStreetlight(640,288,98);drawFence();drawPile(70,300,200,92);drawPile(285,282,230,104);drawPile(560,296,235,96)}
function drawTrashBag(o,hover){const{x,y,w,h}=o;const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,hover?"#4c4d54":"#37383e");g.addColorStop(.55,hover?"#2c2d33":"#202126");g.addColorStop(1,hover?"#17181d":"#0d0e11");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+w*.18,y+h*.84);ctx.quadraticCurveTo(x+w*.06,y+h*.62,x+w*.18,y+h*.31);ctx.quadraticCurveTo(x+w*.26,y+h*.14,x+w*.42,y+h*.13);ctx.quadraticCurveTo(x+w*.46,y+h*.08,x+w*.5,y+h*.09);ctx.quadraticCurveTo(x+w*.56,y+h*.08,x+w*.61,y+h*.14);ctx.quadraticCurveTo(x+w*.78,y+h*.15,x+w*.88,y+h*.35);ctx.quadraticCurveTo(x+w*.98,y+h*.64,x+w*.8,y+h*.88);ctx.quadraticCurveTo(x+w*.55,y+h*.98,x+w*.18,y+h*.84);ctx.closePath();ctx.fill();ctx.fillStyle=hover?"#56575e":"#3d3e44";ctx.beginPath();ctx.moveTo(x+w*.43,y+h*.16);ctx.lineTo(x+w*.38,y+h*.05);ctx.lineTo(x+w*.45,y+h*.01);ctx.lineTo(x+w*.5,y+h*.12);ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(255,255,255,.11)";ctx.lineWidth=Math.max(2,w*.025);ctx.beginPath();ctx.moveTo(x+w*.3,y+h*.34);ctx.quadraticCurveTo(x+w*.42,y+h*.48,x+w*.34,y+h*.74);ctx.moveTo(x+w*.49,y+h*.27);ctx.quadraticCurveTo(x+w*.54,y+h*.49,x+w*.48,y+h*.82);ctx.moveTo(x+w*.68,y+h*.34);ctx.quadraticCurveTo(x+w*.77,y+h*.52,x+w*.69,y+h*.74);ctx.stroke()}
function drawBox(o,hover){const{x,y,w,h}=o;ctx.fillStyle=hover?"#b78959":"#9b7248";ctx.fillRect(x,y+h*.22,w,h*.78);ctx.fillStyle=hover?"#ca9b67":"#af8052";ctx.beginPath();ctx.moveTo(x,y+h*.22);ctx.lineTo(x+w*.18,y+h*.04);ctx.lineTo(x+w*.52,y+h*.1);ctx.lineTo(x+w*.42,y+h*.25);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.42,y+h*.25);ctx.lineTo(x+w*.52,y+h*.1);ctx.lineTo(x+w*.86,y);ctx.lineTo(x+w*.78,y+h*.22);ctx.closePath();ctx.fill();ctx.fillStyle="rgba(221,200,151,.7)";ctx.fillRect(x+w*.46,y+h*.22,w*.09,h*.78);ctx.strokeStyle="#5d432c";ctx.lineWidth=3;ctx.strokeRect(x,y+h*.22,w,h*.78)}
function drawCan(o,hover){const{x,y,w,h}=o;ctx.fillStyle=hover?"#aab5b8":"#8f9b9f";ctx.fillRect(x+w*.09,y+h*.17,w*.82,h*.71);ctx.fillStyle=hover?"#c8d1d3":"#b0bbbe";ctx.beginPath();ctx.ellipse(x+w*.5,y+h*.17,w*.43,h*.105,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=hover?"#7c888b":"#6e797c";ctx.beginPath();ctx.ellipse(x+w*.5,y+h*.88,w*.41,h*.085,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#606a6c";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x+w*.5,y+h*.15,w*.46,h*.115,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x+w*.37,y+h*.08);ctx.quadraticCurveTo(x+w*.5,y-h*.015,x+w*.63,y+h*.08);ctx.stroke();ctx.strokeStyle="rgba(91,104,107,.9)";ctx.lineWidth=2;for(let i=0;i<5;i++){const rx=x+w*(.2+i*.15);ctx.beginPath();ctx.moveTo(rx,y+h*.24);ctx.lineTo(rx,y+h*.81);ctx.stroke()}}
function drawTiles(now){if(!S)return;S.tiles.forEach(t=>{const hover=!touchMode&&!t.open&&!overlayOpen&&S.digs>0&&rectHit(t);ctx.save();if(t.open)ctx.globalAlpha=.52;if(t.t==="bag")drawTrashBag(t,hover);else if(t.t==="box")drawBox(t,hover);else drawCan(t,hover);ctx.restore();if(hover){ctx.strokeStyle="#ffb6d9";ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.strokeRect(t.x-5,t.y-5,t.w+10,t.h+10);ctx.setLineDash([])}if(!t.open&&!overlayOpen&&S.digs>0){const tw=(Math.sin(now/400+t.x)+1)/2;ctx.fillStyle=`rgba(255,182,217,${.35+tw*.5})`;ctx.font="18px sans-serif";ctx.textAlign="center";ctx.fillText("✦",t.x+t.w*.8,t.y+8)}})}
function drawMouse(){if(touchMode||mouse.x<0)return;ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(mouse.x,mouse.y,8,0,Math.PI*2);ctx.stroke()}
function draw(now){ctx.clearRect(0,0,canvas.width,canvas.height);drawBackground();drawTiles(now);drawMouse();requestAnimationFrame(draw)}
function updateMouse(e){const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*(canvas.width/r.width);mouse.y=(e.clientY-r.top)*(canvas.height/r.height)}
canvas.addEventListener("pointermove",e=>{touchMode=e.pointerType==="touch";updateMouse(e)});canvas.addEventListener("pointerleave",()=>{mouse={x:-100,y:-100}});canvas.addEventListener("pointerdown",e=>{touchMode=e.pointerType==="touch"});canvas.addEventListener("click",e=>{if(!S)return;updateMouse(e);const pad=touchMode?18:0;const hit=[...S.tiles].reverse().find(t=>!t.open&&mouse.x>=t.x-pad&&mouse.x<=t.x+t.w+pad&&mouse.y>=t.y-pad&&mouse.y<=t.y+t.h+pad);if(hit)dig(hit)});
renderTimeStat();newGame();closeCard();showTitle();requestAnimationFrame(draw);
</script>
