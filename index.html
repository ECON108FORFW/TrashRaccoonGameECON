<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trash Dump</title>
<style>
  html,body{margin:0;min-height:100%;background:#222}
  #gameFrame{display:block;width:100%;min-height:100vh;border:0;background:#222}
</style>
</head>
<body>
<iframe id="gameFrame" src="econ108_index_replacement_v2.html" title="ECON 108 Trash Raccoon Game"></iframe>
<script>
const frame = document.getElementById('gameFrame');

function styleAndModifyGame() {
  const doc = frame.contentDocument;
  if (!doc) return;

  const style = doc.createElement('style');
  style.textContent = `
    html, body {
      min-height:100%;
      background:#222;
    }
    body {
      position:relative;
      overflow-x:hidden;
      background-color:#222;
      background-image:
        radial-gradient(circle at 4% 8%, rgba(255,190,218,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 10% 22%, rgba(255,218,235,.95) 0 1.8px, transparent 3px),
        radial-gradient(circle at 17% 43%, rgba(255,168,207,.94) 0 2.5px, transparent 3.6px),
        radial-gradient(circle at 8% 64%, rgba(255,205,228,.96) 0 2px, transparent 3px),
        radial-gradient(circle at 14% 84%, rgba(255,176,211,.98) 0 2.3px, transparent 3.3px),
        radial-gradient(circle at 25% 12%, rgba(255,224,239,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 31% 31%, rgba(255,185,217,.98) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 27% 58%, rgba(255,212,232,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 34% 78%, rgba(255,170,207,.96) 0 2.2px, transparent 3.2px),
        radial-gradient(circle at 43% 7%, rgba(255,211,232,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 48% 26%, rgba(255,178,213,.98) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 45% 49%, rgba(255,222,238,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 51% 71%, rgba(255,186,218,.98) 0 2.4px, transparent 3.4px),
        radial-gradient(circle at 59% 89%, rgba(255,214,233,.96) 0 2px, transparent 3px),
        radial-gradient(circle at 63% 14%, rgba(255,173,210,.98) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 69% 35%, rgba(255,220,236,.96) 0 2px, transparent 3px),
        radial-gradient(circle at 64% 61%, rgba(255,184,216,.98) 0 2.3px, transparent 3.3px),
        radial-gradient(circle at 74% 81%, rgba(255,211,231,.96) 0 2px, transparent 3px),
        radial-gradient(circle at 81% 9%, rgba(255,178,213,.98) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 88% 27%, rgba(255,224,239,.96) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 51%, rgba(255,188,219,.98) 0 2.4px, transparent 3.4px),
        radial-gradient(circle at 92% 70%, rgba(255,213,233,.96) 0 2px, transparent 3px),
        radial-gradient(circle at 96% 90%, rgba(255,172,208,.98) 0 2.5px, transparent 3.5px);
      background-size:100% 100%;
      animation:backgroundPinkTwinkle 1.05s infinite alternate ease-in-out;
    }
    body::before,
    body::after {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }
    body::before {
      background-image:
        linear-gradient(45deg, transparent 44%, rgba(255,184,216,.95) 47%, rgba(255,226,240,1) 50%, rgba(255,184,216,.95) 53%, transparent 56%),
        linear-gradient(-45deg, transparent 44%, rgba(255,184,216,.95) 47%, rgba(255,226,240,1) 50%, rgba(255,184,216,.95) 53%, transparent 56%);
      background-size:34px 34px,34px 34px;
      background-position:6px 8px,6px 8px;
      opacity:.38;
      animation:backgroundSparkle .7s infinite alternate ease-in-out;
    }
    body::after {
      background-image:
        radial-gradient(circle, rgba(255,201,226,.92) 0 1.5px, transparent 2.5px),
        radial-gradient(circle, rgba(255,169,207,.88) 0 1.8px, transparent 2.8px),
        radial-gradient(circle, rgba(255,224,239,.94) 0 1.4px, transparent 2.4px);
      background-size:26px 26px,39px 39px,52px 52px;
      background-position:0 0,11px 17px,23px 7px;
      opacity:.82;
      animation:backgroundDrift 2.2s linear infinite;
    }
    .wrap, .top-ui, .stage, #status, .description-bubble {
      position:relative;
      z-index:1;
    }
    .stage {
      background:#222;
    }
    .stage canvas {
      position:relative;
      z-index:3;
    }
    .top-ui {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
      position:relative;
    }
    .bubble {
      background:#efe5c7;
      color:#2c2418;
      border:3px solid #4d4336;
      border-radius:24px;
      box-shadow:0 4px 0 rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
    }
    .title-bubble {
      min-width:360px;
      max-width:560px;
      padding:16px 24px 14px;
      text-align:center;
    }
    .title-bubble h1 {
      margin:0;
      font-size:32px;
      line-height:1.1;
      color:#2c2418;
      position:relative;
      z-index:1;
    }
    .made-with-ai {
      margin-top:5px;
      font-size:14px;
      font-weight:bold;
      color:#5d5241;
      letter-spacing:.2px;
      position:relative;
      z-index:1;
    }
    .creator-bubble {
      padding:14px 18px;
      min-width:220px;
      font-weight:bold;
      text-align:center;
      margin-top:8px;
    }
    .creator-bubble span,
    .description-bubble > * {
      position:relative;
      z-index:1;
    }
    #status {
      margin-top:10px;
      margin-bottom:8px;
      text-align:center;
      position:relative;
      overflow:hidden;
      padding:8px 12px;
      border-radius:16px;
    }
    .description-bubble {
      margin-top:0;
      padding:14px 18px;
      text-align:left;
    }
    .description-bubble .description-label {
      font-weight:bold;
      font-size:18px;
      margin-bottom:8px;
    }
    .description-bubble .description-content {
      min-height:48px;
      color:#5d5241;
      line-height:1.4;
    }

    /* loud light-pink glitter on UI; game canvas remains untouched */
    .top-ui::before,
    .bubble::before,
    .bubble::after,
    #status::before,
    #status::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-repeat:no-repeat;
    }
    .top-ui::before {
      background-image:
        radial-gradient(circle at 6% 18%, rgba(255,182,211,1) 0 2px, transparent 3px),
        radial-gradient(circle at 15% 76%, rgba(255,205,224,.98) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 28% 34%, rgba(255,170,205,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 41% 82%, rgba(255,220,234,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 55% 16%, rgba(255,190,216,1) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 68% 70%, rgba(255,210,229,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 81% 28%, rgba(255,175,210,1) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 94% 66%, rgba(255,215,232,.98) 0 2px, transparent 3px);
      opacity:.85;
      animation:pinkTwinkle 1.1s infinite alternate ease-in-out;
    }
    .bubble::before, #status::before {
      background-image:
        radial-gradient(circle at 8% 22%, rgba(255,190,218,1) 0 2.2px, transparent 3.2px),
        radial-gradient(circle at 20% 72%, rgba(255,214,231,1) 0 2.6px, transparent 3.6px),
        radial-gradient(circle at 34% 30%, rgba(255,168,205,1) 0 2.1px, transparent 3.1px),
        radial-gradient(circle at 49% 78%, rgba(255,203,225,1) 0 2.5px, transparent 3.5px),
        radial-gradient(circle at 63% 24%, rgba(255,184,214,1) 0 2.3px, transparent 3.3px),
        radial-gradient(circle at 77% 69%, rgba(255,220,235,1) 0 2.4px, transparent 3.4px),
        radial-gradient(circle at 90% 34%, rgba(255,174,208,1) 0 2.5px, transparent 3.5px);
      opacity:.82;
      animation:pinkPulse .8s infinite alternate ease-in-out;
    }
    .bubble::after, #status::after {
      background-image:
        linear-gradient(45deg, transparent 44%, rgba(255,185,215,.95) 47%, rgba(255,225,238,1) 50%, rgba(255,185,215,.95) 53%, transparent 56%),
        linear-gradient(-45deg, transparent 44%, rgba(255,185,215,.95) 47%, rgba(255,225,238,1) 50%, rgba(255,185,215,.95) 53%, transparent 56%),
        linear-gradient(45deg, transparent 44%, rgba(255,164,203,.9) 47%, rgba(255,218,235,1) 50%, rgba(255,164,203,.9) 53%, transparent 56%),
        linear-gradient(-45deg, transparent 44%, rgba(255,164,203,.9) 47%, rgba(255,218,235,1) 50%, rgba(255,164,203,.9) 53%, transparent 56%);
      background-size:24px 24px,24px 24px,18px 18px,18px 18px;
      background-position:12% 28%,12% 28%,72% 62%,72% 62%;
      opacity:.58;
      animation:pinkSparkle .65s infinite alternate ease-in-out;
    }
    @keyframes pinkTwinkle {
      from { opacity:.55; filter:brightness(1); }
      to { opacity:1; filter:brightness(1.35); }
    }
    @keyframes pinkPulse {
      from { opacity:.5; transform:scale(1); }
      to { opacity:.95; transform:scale(1.01); }
    }
    @keyframes pinkSparkle {
      from { opacity:.28; }
      to { opacity:.78; }
    }
    @keyframes backgroundPinkTwinkle {
      from { background-color:#222; filter:brightness(1); }
      to { background-color:#242024; filter:brightness(1.08); }
    }
    @keyframes backgroundSparkle {
      from { opacity:.22; }
      to { opacity:.56; }
    }
    @keyframes backgroundDrift {
      from { background-position:0 0,11px 17px,23px 7px; }
      to { background-position:26px 26px,50px 56px,75px 59px; }
    }
  `;
  doc.head.appendChild(style);

  const wrap = doc.querySelector('.wrap');
  const oldTitle = wrap?.querySelector('h1');
  const oldSubtitle = wrap?.querySelector('p');
  const stage = wrap?.querySelector('.stage');
  if (!wrap || !stage) return;

  const topUI = doc.createElement('div');
  topUI.className = 'top-ui';

  const titleBubble = doc.createElement('div');
  titleBubble.className = 'bubble title-bubble';
  titleBubble.innerHTML = '<h1>Trash Dump</h1><div class="made-with-ai">Made with AI</div>';

  const creatorBubble = doc.createElement('div');
  creatorBubble.className = 'bubble creator-bubble';
  creatorBubble.innerHTML = '<span>Creator Names Here</span>';

  topUI.appendChild(titleBubble);
  topUI.appendChild(creatorBubble);

  if (oldTitle) oldTitle.remove();
  if (oldSubtitle) oldSubtitle.remove();
  wrap.insertBefore(topUI, wrap.firstChild);

  const description = doc.createElement('div');
  description.className = 'bubble description-bubble';
  description.innerHTML = '<div class="description-label">Description</div><div class="description-content"></div>';
  stage.insertAdjacentElement('afterend', description);

  const status = doc.getElementById('status');
  if (status) {
    description.insertAdjacentElement('beforebegin', status);
  }

  const resize = () => {
    frame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
  };
  resize();
  new ResizeObserver(resize).observe(doc.body);
}

frame.addEventListener('load', styleAndModifyGame);
</script>
</body>
</html>
