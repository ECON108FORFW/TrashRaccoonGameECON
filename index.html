<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treasure Through Trash</title>
<style>
  html,body{margin:0;min-height:100%;background:#222}
  #gameFrame{display:block;width:100%;min-height:100vh;border:0;background:#222}
</style>
</head>
<body>
<iframe id="gameFrame" src="econ108_index_replacement_v2.html" title="ECON 108 Trash Raccoon Game"></iframe>
<script>
const frame = document.getElementById('gameFrame');

function styleAndModifyGame() {
  const doc = frame.contentDocument;
  if (!doc) return;

  const style = doc.createElement('style');
  style.textContent = `
    html, body { min-height:100%; background:#222; }
    body { position:relative; overflow-x:hidden; background:#222; }

    .pink-star {
      position:fixed;
      z-index:0;
      pointer-events:none;
      color:#ffb6d9;
      text-shadow:0 0 7px rgba(255,182,217,.95),0 0 14px rgba(255,182,217,.55);
      line-height:1;
      animation:starTwinkle var(--speed) infinite alternate ease-in-out;
      opacity:var(--opacity);
      transform:rotate(var(--rot)) scale(var(--scale));
    }

    .wrap, .top-ui, .stage, #status, .description-bubble { position:relative; z-index:2; }
    .stage { background:#222; }
    .stage canvas { position:relative; z-index:3; }
    .stage .player,
    .player {
      z-index:5 !important;
      display:block !important;
      visibility:visible !important;
      opacity:1 !important;
    }

    .game-stats {
      position:absolute;
      top:12px;
      right:12px;
      z-index:8;
      display:flex;
      gap:8px;
      align-items:stretch;
      pointer-events:none;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .stat-box {
      min-width:142px;
      box-sizing:border-box;
      padding:9px 11px;
      border:2px solid rgba(255,214,232,.9);
      border-radius:14px;
      background:rgba(31,27,31,.88);
      color:#fff4fa;
      box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 10px rgba(255,182,217,.28);
      text-shadow:0 1px 2px rgba(0,0,0,.8);
    }
    .stat-label {
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.8px;
      color:#ffb6d9;
      margin-bottom:4px;
    }
    .stat-value { font-size:17px; font-weight:900; line-height:1.05; }
    .stat-subvalue { margin-top:4px; font-size:11px; font-weight:700; color:#eadde4; }
    .load-bar {
      width:100%;
      height:8px;
      margin-top:7px;
      overflow:hidden;
      border-radius:999px;
      border:1px solid rgba(255,220,235,.7);
      background:rgba(255,255,255,.13);
    }
    .load-bar-fill { width:0%; height:100%; background:linear-gradient(90deg,#ffb6d9,#ff75b8); }

    .top-ui {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
      position:relative;
    }
    .bubble {
      background:#efe5c7;
      color:#2c2418;
      border:3px solid #4d4336;
      border-radius:24px;
      box-shadow:0 4px 0 rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
    }
    .title-bubble {
      min-width:360px;
      max-width:650px;
      padding:16px 24px 14px;
      text-align:center;
    }
    .glitter-title,
    .title-bubble h1 {
      margin:0;
      font-family:"Brush Script MT","Segoe Script","Comic Sans MS",cursive;
      font-size:50px;
      font-weight:900;
      font-style:italic;
      line-height:.95;
      letter-spacing:1.5px;
      position:relative;
      z-index:2;
      color:#ffb6d9;
      background:linear-gradient(180deg,#fff4fb 0%,#ffd1e6 24%,#ff9fca 52%,#ff6fb3 74%,#fff1f8 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke:1px rgba(126,54,92,.75);
      text-shadow:0 1px 0 #fff,0 2px 0 #ff9dca,0 3px 0 #d85f9a,0 0 5px rgba(255,255,255,.95),0 0 10px rgba(255,182,217,.95),0 0 18px rgba(255,105,180,.8),2px 3px 0 rgba(78,38,58,.35);
      transform:rotate(-1.5deg) scaleX(1.05);
      filter:drop-shadow(0 0 5px rgba(255,182,217,.85));
    }
    .made-with-ai {
      margin-top:8px;
      font-size:14px;
      font-weight:bold;
      color:#5d5241;
      letter-spacing:.2px;
      position:relative;
      z-index:2;
    }
    .creator-bubble {
      padding:14px 18px;
      min-width:220px;
      font-weight:bold;
      text-align:center;
      margin-top:8px;
    }
    .creator-bubble span,.description-bubble > * { position:relative; z-index:2; }
    #status {
      margin-top:10px;
      margin-bottom:8px;
      text-align:center;
      position:relative;
      overflow:hidden;
      padding:8px 12px;
      border-radius:16px;
    }
    .description-bubble { margin-top:0; padding:14px 18px; text-align:left; }
    .description-bubble .description-label { font-weight:bold; font-size:18px; margin-bottom:8px; }
    .description-bubble .description-content { min-height:48px; color:#5d5241; line-height:1.4; }

    .bubble-star {
      position:absolute;
      pointer-events:none;
      color:#ffb6d9;
      text-shadow:0 0 6px rgba(255,182,217,.95),0 0 11px rgba(255,182,217,.55);
      z-index:1;
      animation:bubbleStarTwinkle var(--speed) infinite alternate ease-in-out;
      opacity:var(--opacity);
      transform:rotate(var(--rot)) scale(var(--scale));
      line-height:1;
    }

    .main-menu-overlay {
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      background:rgba(14,11,15,.94);
      backdrop-filter:blur(7px);
      transition:opacity .28s ease, visibility .28s ease;
      overflow:hidden;
    }
    .main-menu-overlay.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .main-menu-card {
      width:min(760px,90vw);
      min-height:360px;
      box-sizing:border-box;
      padding:54px 48px 46px;
      border:4px solid #ffb6d9;
      border-radius:38px;
      background:linear-gradient(180deg,rgba(56,38,52,.98),rgba(26,21,27,.98));
      box-shadow:0 0 0 6px rgba(255,182,217,.14),0 0 35px rgba(255,128,190,.55),0 0 80px rgba(255,182,217,.28),0 18px 45px rgba(0,0,0,.62);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .main-menu-title { font-size:72px; line-height:.92; margin:0 auto 28px; max-width:680px; }
    .menu-start-label {
      margin:8px 0 18px;
      font-size:18px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:3px;
      color:#ffe5f1;
      text-shadow:0 0 9px rgba(255,182,217,.85);
    }
    .how-to-body,
    .end-night-body {
      max-width:590px;
      margin:8px auto 30px;
      font-family:Arial,Helvetica,sans-serif;
      font-size:17px;
      line-height:1.55;
      color:#fff4fa;
      position:relative;
      z-index:4;
      text-shadow:0 1px 2px rgba(0,0,0,.8);
    }
    .play-button {
      appearance:none;
      border:3px solid #fff0f7;
      border-radius:999px;
      padding:17px 34px 18px;
      min-width:190px;
      cursor:pointer;
      font:900 22px/1 system-ui,sans-serif;
      letter-spacing:1.5px;
      color:#54223d;
      background:linear-gradient(180deg,#ffeaf4 0%,#ffb6d9 44%,#ff8fc3 100%);
      box-shadow:0 0 0 5px rgba(255,182,217,.16),0 0 18px rgba(255,182,217,.8),0 0 38px rgba(255,105,180,.5),0 7px 0 #a84e7c;
      transform:translateY(0);
      transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
      position:relative;
      z-index:4;
    }
    .play-button:hover { filter:brightness(1.08) saturate(1.15); transform:translateY(-2px) scale(1.03); }
    .play-button:active { transform:translateY(5px); box-shadow:0 0 0 4px rgba(255,182,217,.14),0 0 16px rgba(255,182,217,.72),0 2px 0 #a84e7c; }
    .menu-star {
      position:absolute;
      pointer-events:none;
      color:#ffb6d9;
      text-shadow:0 0 8px rgba(255,182,217,1),0 0 18px rgba(255,105,180,.8);
      animation:menuStarTwinkle var(--speed) infinite alternate ease-in-out;
      opacity:var(--opacity);
      transform:rotate(var(--rot)) scale(var(--scale));
      line-height:1;
    }

    @keyframes starTwinkle { from { opacity:.28; filter:brightness(.9); transform:rotate(var(--rot)) scale(calc(var(--scale) * .72)); } to { opacity:1; filter:brightness(1.5); transform:rotate(var(--rot)) scale(calc(var(--scale) * 1.28)); } }
    @keyframes bubbleStarTwinkle { from { opacity:.35; filter:brightness(1); } to { opacity:1; filter:brightness(1.45); } }
    @keyframes menuStarTwinkle { from { opacity:.25; filter:brightness(.9); } to { opacity:1; filter:brightness(1.65); } }
  `;
  doc.head.appendChild(style);

  const wrap = doc.querySelector('.wrap');
  const oldTitle = wrap?.querySelector('h1');
  const oldSubtitle = wrap?.querySelector('p');
  const stage = wrap?.querySelector('.stage');
  if (!wrap || !stage) return;

  const topUI = doc.createElement('div');
  topUI.className = 'top-ui';

  const titleBubble = doc.createElement('div');
  titleBubble.className = 'bubble title-bubble';
  titleBubble.innerHTML = '<h1>Treasure Through Trash</h1><div class="made-with-ai">Made with AI</div>';

  const creatorBubble = doc.createElement('div');
  creatorBubble.className = 'bubble creator-bubble';
  creatorBubble.innerHTML = '<span>Tagline Here</span>';

  topUI.appendChild(titleBubble);
  topUI.appendChild(creatorBubble);

  if (oldTitle) oldTitle.remove();
  if (oldSubtitle) oldSubtitle.remove();
  wrap.insertBefore(topUI, wrap.firstChild);

  const description = doc.createElement('div');
  description.className = 'bubble description-bubble';
  description.innerHTML = '<div class="description-label">Description</div><div class="description-content"></div>';
  stage.insertAdjacentElement('afterend', description);

  const status = doc.getElementById('status');
  if (status) description.insertAdjacentElement('beforebegin', status);

  const statsPanel = doc.createElement('div');
  statsPanel.className = 'game-stats';
  statsPanel.innerHTML = `
    <div class="stat-box carry-stat">
      <div class="stat-label">Carry Load Left</div>
      <div class="stat-value">0/30 Pounds</div>
      <div class="load-bar" aria-hidden="true"><div class="load-bar-fill"></div></div>
    </div>
    <div class="stat-box time-stat">
      <div class="stat-label">Time</div>
      <div class="stat-value time-value">7:00 PM</div>
      <div class="stat-subvalue hours-left-value">12 hours left until 7:00 AM</div>
    </div>
  `;
  stage.appendChild(statsPanel);

  const starChars = ['✦','✧','★','⋆'];

  function addMenuStars(card, count = 52) {
    for (let i = 0; i < count; i++) {
      const s = doc.createElement('span');
      s.className = 'menu-star';
      s.textContent = starChars[Math.floor(Math.random()*starChars.length)];
      s.style.left = (2 + Math.random()*96) + '%';
      s.style.top = (2 + Math.random()*96) + '%';
      s.style.fontSize = (9 + Math.random()*24) + 'px';
      s.style.setProperty('--speed', (.42 + Math.random()*1.3) + 's');
      s.style.setProperty('--opacity', (.4 + Math.random()*.6).toFixed(2));
      s.style.setProperty('--rot', Math.floor(Math.random()*360) + 'deg');
      s.style.setProperty('--scale', (.65 + Math.random()*1.4).toFixed(2));
      card.appendChild(s);
    }
  }

  let endScreenShown = false;
  function showEndOfNight() {
    if (endScreenShown) return;
    endScreenShown = true;

    const endOverlay = doc.createElement('div');
    endOverlay.className = 'main-menu-overlay';
    endOverlay.setAttribute('role','dialog');
    endOverlay.setAttribute('aria-modal','true');
    endOverlay.setAttribute('aria-label','End of Night');

    const endCard = doc.createElement('div');
    endCard.className = 'main-menu-card';
    endCard.innerHTML = `
      <div class="glitter-title main-menu-title">End of Night</div>
      <div class="end-night-body">The night has ended. Your run through the dump is complete.</div>
    `;
    endOverlay.appendChild(endCard);
    doc.body.appendChild(endOverlay);
    addMenuStars(endCard);
  }

  let elapsedGameHours = 0;
  const timeValue = statsPanel.querySelector('.time-value');
  const hoursLeftValue = statsPanel.querySelector('.hours-left-value');

  function formatGameTime(totalHour) {
    const hour24 = ((totalHour % 24) + 24) % 24;
    const suffix = hour24 >= 12 ? 'PM' : 'AM';
    const hour12 = hour24 % 12 || 12;
    return `${hour12}:00 ${suffix}`;
  }

  function updateTimeStat() {
    const currentHour = 19 + elapsedGameHours;
    const hoursLeft = Math.max(0, 12 - elapsedGameHours);
    timeValue.textContent = formatGameTime(currentHour);
    hoursLeftValue.textContent = `${hoursLeft} ${hoursLeft === 1 ? 'hour' : 'hours'} left until 7:00 AM`;
  }

  function advanceGameTime() {
    elapsedGameHours += 2;
    updateTimeStat();
    if (elapsedGameHours > 0 && timeValue.textContent === '7:00 PM') {
      showEndOfNight();
    }
  }

  updateTimeStat();

  const gameCanvas = stage.querySelector('canvas');
  if (gameCanvas && status) {
    gameCanvas.addEventListener('click', () => {
      requestAnimationFrame(() => {
        if (status.textContent.trim().startsWith('You clicked:')) advanceGameTime();
      });
    });
  }

  function addBubbleStars(el, count) {
    for (let i = 0; i < count; i++) {
      const s = doc.createElement('span');
      s.className = 'bubble-star';
      s.textContent = starChars[Math.floor(Math.random()*starChars.length)];
      s.style.left = (3 + Math.random()*94) + '%';
      s.style.top = (8 + Math.random()*84) + '%';
      s.style.fontSize = (7 + Math.random()*10) + 'px';
      s.style.setProperty('--speed', (.45 + Math.random()*1.2) + 's');
      s.style.setProperty('--opacity', (.45 + Math.random()*.5).toFixed(2));
      s.style.setProperty('--rot', Math.floor(Math.random()*360) + 'deg');
      s.style.setProperty('--scale', (.7 + Math.random()*.9).toFixed(2));
      el.appendChild(s);
    }
  }

  [titleBubble, creatorBubble, description].forEach(el => addBubbleStars(el, 18));
  if (status) addBubbleStars(status, 12);

  function clearBackgroundStars() { doc.querySelectorAll('.pink-star').forEach(n => n.remove()); }
  function rectsToAvoid() { return [stage, titleBubble, creatorBubble, description, status].filter(Boolean).map(el => el.getBoundingClientRect()); }
  function isInsideAvoid(x, y, rects) { return rects.some(r => x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8); }

  function scatterBackgroundStars() {
    clearBackgroundStars();
    const rects = rectsToAvoid();
    const w = doc.documentElement.clientWidth;
    const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight, innerHeight);
    const target = Math.max(180, Math.floor((w*h)/6500));
    let made = 0;
    let tries = 0;
    while (made < target && tries < target * 12) {
      tries++;
      const x = Math.random() * w;
      const y = Math.random() * h;
      if (isInsideAvoid(x, y, rects)) continue;
      const s = doc.createElement('span');
      s.className = 'pink-star';
      s.textContent = starChars[Math.floor(Math.random()*starChars.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.fontSize = (8 + Math.random()*14) + 'px';
      s.style.setProperty('--speed', (.5 + Math.random()*1.6) + 's');
      s.style.setProperty('--opacity', (.45 + Math.random()*.55).toFixed(2));
      s.style.setProperty('--rot', Math.floor(Math.random()*360) + 'deg');
      s.style.setProperty('--scale', (.75 + Math.random()*1.15).toFixed(2));
      doc.body.appendChild(s);
      made++;
    }
  }

  const menuOverlay = doc.createElement('div');
  menuOverlay.className = 'main-menu-overlay';
  menuOverlay.setAttribute('role','dialog');
  menuOverlay.setAttribute('aria-modal','true');
  menuOverlay.setAttribute('aria-label','Treasure Through Trash main menu');

  const menuCard = doc.createElement('div');
  menuCard.className = 'main-menu-card';
  menuCard.innerHTML = `
    <div class="glitter-title main-menu-title">Treasure Through Trash</div>
    <div class="menu-start-label">Start Game</div>
    <button class="play-button" type="button" aria-label="Open how to play">▶ PLAY</button>
  `;
  menuOverlay.appendChild(menuCard);
  doc.body.appendChild(menuOverlay);
  addMenuStars(menuCard);

  const playButton = menuCard.querySelector('.play-button');
  playButton.addEventListener('click', () => {
    menuCard.innerHTML = `
      <div class="glitter-title main-menu-title">How to Play</div>
      <div class="how-to-body">Click around the trash dump to inspect objects and discover what each piece of trash has to tell you.</div>
      <button class="play-button how-to-continue" type="button" aria-label="Start game">START GAME</button>
    `;
    addMenuStars(menuCard);
    const continueButton = menuCard.querySelector('.how-to-continue');
    continueButton.addEventListener('click', () => {
      menuOverlay.classList.add('is-hidden');
      setTimeout(() => menuOverlay.remove(), 320);
    });
    requestAnimationFrame(() => continueButton.focus());
  });
  requestAnimationFrame(() => playButton.focus());

  const resize = () => { frame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px'; };
  resize();
  scatterBackgroundStars();
  new ResizeObserver(() => { resize(); scatterBackgroundStars(); }).observe(doc.body);
}

frame.addEventListener('load', styleAndModifyGame);
</script>
</body>
</html>
