<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trash Dump</title>
<style>
  html,body{margin:0;min-height:100%;background:#222}
  #gameFrame{display:block;width:100%;min-height:100vh;border:0;background:#222}
</style>
</head>
<body>
<iframe id="gameFrame" src="econ108_index_replacement_v2.html" title="ECON 108 Trash Raccoon Game"></iframe>
<script>
const frame = document.getElementById('gameFrame');

function styleAndModifyGame() {
  const doc = frame.contentDocument;
  if (!doc) return;

  const style = doc.createElement('style');
  style.textContent = `
    .top-ui {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
      position:relative;
    }
    .bubble {
      background:#efe5c7;
      color:#2c2418;
      border:3px solid #4d4336;
      border-radius:24px;
      box-shadow:0 4px 0 rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
    }
    .title-bubble {
      min-width:360px;
      max-width:560px;
      padding:16px 24px 14px;
      text-align:center;
    }
    .title-bubble h1 {
      margin:0;
      font-size:32px;
      line-height:1.1;
      color:#2c2418;
      position:relative;
      z-index:1;
    }
    .made-with-ai {
      margin-top:5px;
      font-size:14px;
      font-weight:bold;
      color:#5d5241;
      letter-spacing:.2px;
      position:relative;
      z-index:1;
    }
    .creator-bubble {
      padding:14px 18px;
      min-width:220px;
      font-weight:bold;
      text-align:center;
      margin-top:8px;
    }
    .creator-bubble span,
    .description-bubble > * {
      position:relative;
      z-index:1;
    }
    #status {
      margin-top:10px;
      margin-bottom:8px;
      text-align:center;
      position:relative;
      overflow:hidden;
      padding:8px 12px;
      border-radius:16px;
    }
    .description-bubble {
      margin-top:0;
      padding:14px 18px;
      text-align:left;
    }
    .description-bubble .description-label {
      font-weight:bold;
      font-size:18px;
      margin-bottom:8px;
    }
    .description-bubble .description-content {
      min-height:48px;
      color:#5d5241;
      line-height:1.4;
    }

    /* subtle glitter effect on UI only — canvas remains untouched */
    .top-ui::before,
    .bubble::before,
    .bubble::after,
    #status::before,
    #status::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-repeat:no-repeat;
    }
    .top-ui::before {
      background-image:
        radial-gradient(circle at 10% 30%, rgba(255,255,255,.80) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 70%, rgba(255,244,200,.60) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 18%, rgba(255,255,255,.60) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 62%, rgba(255,244,200,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 92% 28%, rgba(255,255,255,.60) 0 1px, transparent 2px);
      opacity:.22;
    }
    .bubble::before, #status::before {
      background-image:
        radial-gradient(circle at 12% 26%, rgba(255,255,255,.90) 0 1.2px, transparent 2.2px),
        radial-gradient(circle at 34% 74%, rgba(255,246,210,.75) 0 1px, transparent 2px),
        radial-gradient(circle at 68% 22%, rgba(255,255,255,.85) 0 1.1px, transparent 2px),
        radial-gradient(circle at 86% 64%, rgba(255,240,190,.70) 0 1px, transparent 2px);
      opacity:.30;
    }
    .bubble::after, #status::after {
      background-image:
        linear-gradient(45deg, transparent 48%, rgba(255,255,255,.70) 49%, rgba(255,255,255,.70) 51%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(255,255,255,.70) 49%, rgba(255,255,255,.70) 51%, transparent 52%),
        linear-gradient(45deg, transparent 48%, rgba(255,248,214,.60) 49%, rgba(255,248,214,.60) 51%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(255,248,214,.60) 49%, rgba(255,248,214,.60) 51%, transparent 52%);
      background-size:16px 16px,16px 16px,12px 12px,12px 12px;
      background-position:18% 36%,18% 36%,74% 28%,74% 28%;
      opacity:.16;
    }
  `;
  doc.head.appendChild(style);

  const wrap = doc.querySelector('.wrap');
  const oldTitle = wrap?.querySelector('h1');
  const oldSubtitle = wrap?.querySelector('p');
  const stage = wrap?.querySelector('.stage');
  if (!wrap || !stage) return;

  const topUI = doc.createElement('div');
  topUI.className = 'top-ui';

  const titleBubble = doc.createElement('div');
  titleBubble.className = 'bubble title-bubble';
  titleBubble.innerHTML = '<h1>Trash Dump</h1><div class="made-with-ai">Made with AI</div>';

  const creatorBubble = doc.createElement('div');
  creatorBubble.className = 'bubble creator-bubble';
  creatorBubble.innerHTML = '<span>Creator Names Here</span>';

  topUI.appendChild(titleBubble);
  topUI.appendChild(creatorBubble);

  if (oldTitle) oldTitle.remove();
  if (oldSubtitle) oldSubtitle.remove();
  wrap.insertBefore(topUI, wrap.firstChild);

  const description = doc.createElement('div');
  description.className = 'bubble description-bubble';
  description.innerHTML = '<div class="description-label">Description</div><div class="description-content"></div>';
  stage.insertAdjacentElement('afterend', description);

  const status = doc.getElementById('status');
  if (status) {
    description.insertAdjacentElement('beforebegin', status);
  }

  const resize = () => {
    frame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
  };
  resize();
  new ResizeObserver(resize).observe(doc.body);
}

frame.addEventListener('load', styleAndModifyGame);
</script>
</body>
</html>
