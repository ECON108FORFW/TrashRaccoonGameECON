<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trash Dump</title>
<style>
  html,body{margin:0;min-height:100%;background:#222}
  #gameFrame{display:block;width:100%;min-height:100vh;border:0;background:#222}
</style>
</head>
<body>
<iframe id="gameFrame" src="econ108_index_replacement_v2.html" title="ECON 108 Trash Raccoon Game"></iframe>
<script>
const frame = document.getElementById('gameFrame');

function styleAndModifyGame() {
  const doc = frame.contentDocument;
  if (!doc) return;

  const style = doc.createElement('style');
  style.textContent = `
    html, body { min-height:100%; background:#222; }
    body { position:relative; overflow-x:hidden; background:#222; }

    .pink-star {
      position:fixed;
      z-index:0;
      pointer-events:none;
      color:#ffb6d9;
      text-shadow:0 0 7px rgba(255,182,217,.95),0 0 14px rgba(255,182,217,.55);
      line-height:1;
      animation:starTwinkle var(--speed) infinite alternate ease-in-out;
      opacity:var(--opacity);
      transform:rotate(var(--rot)) scale(var(--scale));
    }

    .wrap, .top-ui, .stage, #status, .description-bubble { position:relative; z-index:2; }
    .stage { background:#222; }
    .stage canvas { position:relative; z-index:3; }
    .stage .player,
    .player {
      z-index:5 !important;
      display:block !important;
      visibility:visible !important;
      opacity:1 !important;
    }

    .top-ui {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
      position:relative;
    }
    .bubble {
      background:#efe5c7;
      color:#2c2418;
      border:3px solid #4d4336;
      border-radius:24px;
      box-shadow:0 4px 0 rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
    }
    .title-bubble {
      min-width:360px;
      max-width:560px;
      padding:16px 24px 14px;
      text-align:center;
    }
    .title-bubble h1 {
      margin:0;
      font-family:"Brush Script MT","Segoe Script","Comic Sans MS",cursive;
      font-size:50px;
      font-weight:900;
      font-style:italic;
      line-height:.95;
      letter-spacing:1.5px;
      position:relative;
      z-index:2;
      color:#ffb6d9;
      background:linear-gradient(180deg,#fff4fb 0%,#ffd1e6 24%,#ff9fca 52%,#ff6fb3 74%,#fff1f8 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke:1px rgba(126,54,92,.75);
      text-shadow:
        0 1px 0 #fff,
        0 2px 0 #ff9dca,
        0 3px 0 #d85f9a,
        0 0 5px rgba(255,255,255,.95),
        0 0 10px rgba(255,182,217,.95),
        0 0 18px rgba(255,105,180,.8),
        2px 3px 0 rgba(78,38,58,.35);
      transform:rotate(-1.5deg) scaleX(1.05);
      filter:drop-shadow(0 0 5px rgba(255,182,217,.85));
    }
    .made-with-ai {
      margin-top:8px;
      font-size:14px;
      font-weight:bold;
      color:#5d5241;
      letter-spacing:.2px;
      position:relative;
      z-index:2;
    }
    .creator-bubble {
      padding:14px 18px;
      min-width:220px;
      font-weight:bold;
      text-align:center;
      margin-top:8px;
    }
    .creator-bubble span,
    .description-bubble > * {
      position:relative;
      z-index:2;
    }
    #status {
      margin-top:10px;
      margin-bottom:8px;
      text-align:center;
      position:relative;
      overflow:hidden;
      padding:8px 12px;
      border-radius:16px;
    }
    .description-bubble {
      margin-top:0;
      padding:14px 18px;
      text-align:left;
    }
    .description-bubble .description-label {
      font-weight:bold;
      font-size:18px;
      margin-bottom:8px;
    }
    .description-bubble .description-content {
      min-height:48px;
      color:#5d5241;
      line-height:1.4;
    }

    .bubble-star {
      position:absolute;
      pointer-events:none;
      color:#ffb6d9;
      text-shadow:0 0 6px rgba(255,182,217,.95),0 0 11px rgba(255,182,217,.55);
      z-index:1;
      animation:bubbleStarTwinkle var(--speed) infinite alternate ease-in-out;
      opacity:var(--opacity);
      transform:rotate(var(--rot)) scale(var(--scale));
      line-height:1;
    }

    @keyframes starTwinkle {
      from { opacity:.28; filter:brightness(.9); transform:rotate(var(--rot)) scale(calc(var(--scale) * .72)); }
      to   { opacity:1; filter:brightness(1.5); transform:rotate(var(--rot)) scale(calc(var(--scale) * 1.28)); }
    }
    @keyframes bubbleStarTwinkle {
      from { opacity:.35; filter:brightness(1); }
      to   { opacity:1; filter:brightness(1.45); }
    }
  `;
  doc.head.appendChild(style);

  const wrap = doc.querySelector('.wrap');
  const oldTitle = wrap?.querySelector('h1');
  const oldSubtitle = wrap?.querySelector('p');
  const stage = wrap?.querySelector('.stage');
  if (!wrap || !stage) return;

  const topUI = doc.createElement('div');
  topUI.className = 'top-ui';

  const titleBubble = doc.createElement('div');
  titleBubble.className = 'bubble title-bubble';
  titleBubble.innerHTML = '<h1>Trash Dump</h1><div class="made-with-ai">Made with AI</div>';

  const creatorBubble = doc.createElement('div');
  creatorBubble.className = 'bubble creator-bubble';
  creatorBubble.innerHTML = '<span>Creator Names Here</span>';

  topUI.appendChild(titleBubble);
  topUI.appendChild(creatorBubble);

  if (oldTitle) oldTitle.remove();
  if (oldSubtitle) oldSubtitle.remove();
  wrap.insertBefore(topUI, wrap.firstChild);

  const description = doc.createElement('div');
  description.className = 'bubble description-bubble';
  description.innerHTML = '<div class="description-label">Description</div><div class="description-content"></div>';
  stage.insertAdjacentElement('afterend', description);

  const status = doc.getElementById('status');
  if (status) description.insertAdjacentElement('beforebegin', status);

  const starChars = ['✦','✧','★','⋆'];

  function addBubbleStars(el, count) {
    for (let i = 0; i < count; i++) {
      const s = doc.createElement('span');
      s.className = 'bubble-star';
      s.textContent = starChars[Math.floor(Math.random()*starChars.length)];
      s.style.left = (3 + Math.random()*94) + '%';
      s.style.top = (8 + Math.random()*84) + '%';
      s.style.fontSize = (7 + Math.random()*10) + 'px';
      s.style.setProperty('--speed', (.45 + Math.random()*1.2) + 's');
      s.style.setProperty('--opacity', (.45 + Math.random()*.5).toFixed(2));
      s.style.setProperty('--rot', Math.floor(Math.random()*360) + 'deg');
      s.style.setProperty('--scale', (.7 + Math.random()*.9).toFixed(2));
      el.appendChild(s);
    }
  }

  [titleBubble, creatorBubble, description].forEach(el => addBubbleStars(el, 18));
  if (status) addBubbleStars(status, 12);

  function clearBackgroundStars() {
    doc.querySelectorAll('.pink-star').forEach(n => n.remove());
  }

  function rectsToAvoid() {
    return [stage, titleBubble, creatorBubble, description, status].filter(Boolean).map(el => el.getBoundingClientRect());
  }

  function isInsideAvoid(x, y, rects) {
    return rects.some(r => x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8);
  }

  function scatterBackgroundStars() {
    clearBackgroundStars();
    const rects = rectsToAvoid();
    const w = doc.documentElement.clientWidth;
    const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight, innerHeight);
    const target = Math.max(180, Math.floor((w*h)/6500));
    let made = 0;
    let tries = 0;
    while (made < target && tries < target * 12) {
      tries++;
      const x = Math.random() * w;
      const y = Math.random() * h;
      if (isInsideAvoid(x, y, rects)) continue;
      const s = doc.createElement('span');
      s.className = 'pink-star';
      s.textContent = starChars[Math.floor(Math.random()*starChars.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.fontSize = (8 + Math.random()*14) + 'px';
      s.style.setProperty('--speed', (.5 + Math.random()*1.6) + 's');
      s.style.setProperty('--opacity', (.45 + Math.random()*.55).toFixed(2));
      s.style.setProperty('--rot', Math.floor(Math.random()*360) + 'deg');
      s.style.setProperty('--scale', (.75 + Math.random()*1.15).toFixed(2));
      doc.body.appendChild(s);
      made++;
    }
  }

  const resize = () => {
    frame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + 'px';
  };

  resize();
  scatterBackgroundStars();
  new ResizeObserver(() => { resize(); scatterBackgroundStars(); }).observe(doc.body);
}

frame.addEventListener('load', styleAndModifyGame);
</script>
</body>
</html>
