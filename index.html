function has(it,tag){return it.tags.includes(tag)}function rand(a,b){return a+Math.random()*(b-a)}function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fill(s,fr){return s.replaceAll("{X}",fr.short||fr.name)}function $(id){return document.getElementById(id)}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}function valueOf(id,factorSet,taste){const it=ITEMS[id];let m=1;factorSet.forEach(f=>m*=FACTORS[f].eff(it,factorSet));if(taste&&taste.item===id)m*=taste.mult;return Math.max(0,Math.round(it.p*m))}
let elapsedGameHours=0,endNightShown=false;function formatGameTime(totalHour){const h=((totalHour%24)+24)%24,s=h>=12?"PM":"AM",h12=h%12||12;return`${h12}:00 ${s}`}function renderTimeStat(){const tv=$("timeValue"),hv=$("hoursLeftValue");if(!tv||!hv)return;tv.textContent=formatGameTime(19+elapsedGameHours);const left=Math.max(0,12-elapsedGameHours);hv.textContent=`${left} ${left===1?"hour":"hours"} left until 7:00 AM`}function showEndOfNight(){if(endNightShown)return;endNightShown=true;openCard(`<div class="glitter-title" style="font-size:clamp(38px,9vw,64px)">End of Night</div><p class="end-night-body">The night has ended. Your run through the dump is complete.</p>`,52)}function advanceGameTime(){if(endNightShown)return;elapsedGameHours+=2;renderTimeStat();if(elapsedGameHours>=12)showEndOfNight()}
let S=null;function newGame(){elapsedGameHours=0;endNightShown=false;renderTimeStat();S={round:0,results:[]};setupRound()}function setupRound(){const fr=FRIENDS[S.round];let factors;if(S.round===0)factors=["cold","bare",pick(Object.keys(FACTORS).filter(f=>f!=="cold"&&f!=="bare"))];else factors=shuffle(Object.keys(FACTORS)).slice(0,3);const gifts=[];factors.forEach(f=>{const cands=shuffle(Object.keys(ITEMS)).filter(id=>!gifts.includes(id)&&FACTORS[f].hits.some(h=>has(ITEMS[id],h)));if(cands.length)gifts.push(cands[0])});if(factors.includes("cold")&&factors.includes("bare")&&!gifts.some(g=>has(ITEMS[g],"warm")&&has(ITEMS[g],"soft"))){const ws=shuffle(["sock","yarn"]).find(g=>!gifts.includes(g));if(ws)gifts.push(ws)}shuffle(Object.keys(ITEMS)).forEach(id=>{if(gifts.length<5&&!gifts.includes(id))gifts.push(id)});const tItem=pick(gifts),tMult=Math.random()<.5?rand(fr.taste[0],.88):rand(1.12,fr.taste[1]);const tiles=gifts.map(id=>({kind:"gift",id}));shuffle(factors).slice(0,fr.clues).forEach(f=>tiles.push({kind:"clue",f}));if(fr.vague)tiles.push({kind:"vague"});shuffle(JUNK).slice(0,fr.junk).forEach(j=>tiles.push({kind:"junk",j}));const placed=shuffle(tiles).map((t,i)=>Object.assign(t,SPOTS[i],{open:false,openedAt:0}));S.fr=fr;S.factors=new Set(factors);S.taste={item:tItem,mult:tMult};S.tiles=placed;S.known=new Set;S.found=[];S.digs=fr.digs;S.sel=null;S.prevEst={};S.lastDelta={};S.newChip=null;setStatus(`Tap a pile of trash to dig through it. You’ve got <b>${fr.digs} digs</b> before sunrise.`,"");renderUI();showIntro()}function estimate(id){return valueOf(id,S.known,null)}function trueValue(id){return valueOf(id,S.factors,S.taste)}
function dig(tile){if(tile.open||S.digs<=0||overlayOpen)return;tile.open=true;tile.openedAt=performance.now();S.digs--;advanceGameTime();const fr=S.fr,X=fr.short||fr.name;S.lastDelta={};S.newChip=null;let msg="",cls="";if(tile.kind==="gift"){const it=ITEMS[tile.id];S.found.push(tile.id);msg=`${it.e} You found ${/^[aeiou]/i.test(it.n)?"an":"a"} <span class="found-name">${it.n.toLowerCase()}</span>. Grabbing it would cost you <b>${it.p} pebbles</b> of effort. Would ${esc(X)} like it?`;cls="gift"}else if(tile.kind==="clue"){const f=FACTORS[tile.f],before={};S.found.forEach(id=>before[id]=estimate(id));S.known.add(tile.f);S.newChip=tile.f;S.found.forEach(id=>{const d=estimate(id)-before[id];if(d)S.lastDelta[id]=d});const moved=Object.keys(S.lastDelta).length;msg=`${f.clue.e} You found <span class="found-name">${f.clue.n}</span>. ${esc(fill(f.clue.t,fr))}`+(moved?` <b>Your gift shelf just reshuffled.</b>`:"");cls="clue"}else if(tile.kind==="vague"){msg=`${VAGUE.e} You found <span class="found-name">${VAGUE.n}</span>. ${VAGUE.t}`;cls="clue"}else msg=`${tile.j.e} ${tile.j.t}`;if(S.digs===0)msg+="<br><b>The sky’s getting light. No digs left.</b> Pick a gift from your shelf, or give pebbles.";setStatus(msg,cls);renderUI()}
function setStatus(html,cls){const el=$("status");el.className="bubble"+(cls?" "+cls:"");el.innerHTML=html;addBubbleStars(el,8)}function friendImg(fr,size){return`<img src="raccoon.png" alt="${esc(fr.name)}" style="filter:${fr.filter};transform:scaleX(-1);${size?"width:"+size:""}">`}function renderUI(){const fr=S.fr,X=fr.short||fr.name,pawsLeft="🐾".repeat(S.digs)+`<i>${"🐾".repeat(fr.digs-S.digs)}</i>`;$("roundBar").innerHTML=`<div class="who">${friendImg(fr)}<div><b>Gift ${S.round+1} of 3 — for ${esc(fr.name)}</b><span>${esc(fr.role)}</span></div></div><div class="paws"><span class="p">${pawsLeft}</span>digs left</div>`;$("knowTitle").textContent=`What you know about ${X}`;const chips=[...S.known].map(f=>`<div class="chip${S.newChip===f?" new":""}">${FACTORS[f].clue.e} ${esc(fill(FACTORS[f].know,fr))}</div>`);if(S.tiles.some(t=>t.kind==="vague"&&t.open))chips.push('<div class="chip">💌 She thinks you’ve “grown so much.”</div>');$("chips").innerHTML=chips.length?chips.join(""):'<div class="chip empty">Nothing yet. Keep digging — some trash tells you things.</div>';$("shelfTitle").textContent="Gift shelf";$("shelfHint").innerHTML=S.found.length?`Pink bar = your best guess of how much ${esc(X)} would love it. Tap one to choose it.`:"Gifts you dig up land here.";const sorted=S.found.slice().sort((a,b)=>estimate(b)-estimate(a)||ITEMS[b].p-ITEMS[a].p);$("shelf").innerHTML=sorted.map(id=>{const it=ITEMS[id],est=estimate(id),d=S.lastDelta[id],dl=d?`<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d)}</span>`:"";return`<button class="row${S.sel===id?" sel":""}${d?" moved":""}" data-id="${id}"><span class="em">${it.e}</span><span><span class="nm">${esc(it.n)}</span><span class="bar"><i style="width:${Math.min(100,est/16*100)}%"></i></span></span><span class="nums">worth to ${esc(X)}? <b>~${est}</b>${dl}<br>costs you ${it.p}</span></button>`}).join("");$("shelf").querySelectorAll(".row").forEach(b=>b.onclick=()=>{S.sel=b.dataset.id;S.lastDelta={};renderUI()});$("wrapBtn").disabled=!S.sel;$("wrapBtn").textContent=S.sel?`🎁 Wrap the ${ITEMS[S.sel].n.toLowerCase()}`:"🎁 Pick a gift to wrap";$("pebbleBtn").textContent=`Just give ${PEBBLES} pebbles`;addBubbleStars($("roundBar"),6)}
function reactionFor(r){return r>=1.25?'“WHERE did you even FIND this?! I love it!!”':r>=.95?'“Oh! I really like this. Thank you!”':r>=.65?'“Aw, that’s… nice. Thanks!”':r>=.35?'“Oh! A… {item}. How… thoughtful.”':'“…Is this from the bin behind the laundromat?”'}function heartsFor(v){return v>=7?3:v>=4?2:1}function give(kind){const fr=S.fr,X=fr.short||fr.name;let res;if(kind==="pebbles")res={who:fr.name,short:X,kind,e:"🪨",n:`${PEBBLES} pebbles`,cost:PEBBLES,worth:PEBBLES,hearts:fr.pebbleHearts,line:fr.pebbleLine,why:[]};else{const id=S.sel,it=ITEMS[id],v=trueValue(id),why=[];S.factors.forEach(f=>{const m=FACTORS[f].eff(it,S.factors);if(Math.abs(m-1)>.01){let knew=S.known.has(f),txt=fill(FACTORS[f].know,fr);why.push(`<li class="${knew?"k":"u"}">${knew?"✔ You knew":"✘ You never found out"}: ${esc(txt)} <b>${m>1?"(made it worth more)":"(made it worth less)"}</b></li>`)}});if(S.taste.item===id)why.push(`<li class="s">🤫 No clue could have told you: ${esc(X)} ${S.taste.mult>1?"just secretly loves things like this":"privately isn’t a fan of things like this"}.</li>`);if(!why.length)why.push(`<li>Nothing special about it to ${esc(X)}.</li>`);res={who:fr.name,short:X,kind,id,e:it.e,n:it.n,cost:it.p,worth:v,hearts:heartsFor(v),line:reactionFor(v/it.p).replace("{item}",it.n.toLowerCase()),why}}S.results.push(res);showReveal(res)}
let overlayOpen=false;function openCard(html,stars=36){const card=$("card");card.innerHTML=html;for(let i=0;i<stars;i++)card.appendChild(makeStar("menu-star",9,22));$("overlay").classList.remove("hide");overlayOpen=true;card.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>GO[b.dataset.go]())}function closeCard(){$("overlay").classList.add("hide");overlayOpen=false}function portrait(fr){return`<div class="portrait">${friendImg(fr)}${fr.acc?`<span class="acc">${fr.acc}</span>`:""}</div>`}function showTitle(){openCard('<div class="glitter-title">Treasure Through Trash</div><p>One raccoon. One junkyard. <b>Three gifts before sunrise.</b></p><p class="small">Tap trash to dig · tap a gift to pick it · that’s it.</p><button class="btn big" data-go="how">▶ PLAY</button>',52)}function showHow(){openCard('<div class="glitter-title">How to Play</div><p class="how-to-body">Three raccoons need gifts tonight. For each one, <b>dig through the junkyard</b> — but you only get a few digs.</p><p class="how-to-body">Some trash is a <b>gift</b> and some trash is a <b>clue</b> about who you’re shopping for. Clues can change what you think a gift is worth.</p><p class="how-to-body">Pick the gift you think they’ll love most — or play it safe and hand over pebbles.</p><button class="btn big" data-go="start">START GAME</button>',52)}function showIntro(){const fr=S.fr;openCard(`${portrait(fr)}<h3>Gift ${S.round+1} of 3: ${esc(fr.name)}</h3><p>${esc(fr.intro)}</p><p class="small">${fr.digs} digs · 8 piles of trash</p><button class="btn big" data-go="close">Start digging</button>`,30)}function showReveal(r){const fr=S.fr,X=r.short,gap=r.worth-r.cost,last=S.round===2;openCard(`${portrait(fr)}<div class="quote">${esc(r.line)}</div><div class="tag"><div class="gift">${r.e} ${esc(r.n)}</div><div class="paid">You paid: <s>${r.cost} pebbles</s></div><div class="worth">worth to me: ${r.worth} — ${esc(X)}</div></div><div class="gapline ${gap<0?"loss":gap>0?"gain":"even"}">${gap<0?`${-gap} pebbles of effort vanished.`:gap>0?`+${gap}! It meant more than it cost.`:"Nothing vanished."}</div><div class="hearts">${"💗".repeat(r.hearts)}<i>${"💗".repeat(3-r.hearts)}</i></div>${r.kind==="gift"?`<div class="why"><b>Why?</b><ul>${r.why.join("")}</ul></div>`:""}<button class="btn big" data-go="${last?"end":"next"}">${last?"See the night’s tally":"Next gift →"}</button>`,26)}function showEnd(){const R=S.results,cost=R.reduce((a,r)=>a+r.cost,0),worth=R.reduce((a,r)=>a+r.worth,0),hearts=R.reduce((a,r)=>a+r.hearts,0);openCard(`<div class="glitter-title" style="font-size:clamp(34px,8vw,54px)">Sunrise.</div><p class="tally">You spent <b>${cost}</b> pebbles of effort.<br>They got <b>${worth}</b> pebbles of joy.</p><div class="hearts">${"💗".repeat(hearts)}<i>${"💗".repeat(Math.max(0,9-hearts))}</i></div><button class="btn big" data-go="again">↻ Dig again</button>`,40)}const GO={how:showHow,start:()=>{closeCard();newGame()},close:closeCard,next:()=>{S.round++;setupRound()},end:showEnd,again:()=>{closeCard();newGame()}};$("wrapBtn").onclick=()=>{if(S.sel)give("gift")};$("pebbleBtn").onclick=()=>give("pebbles");
const STAR_CHARS=["✦","✧","★","⋆"];function makeStar(cls,min,range){const s=document.createElement("span");s.className=cls;s.textContent=pick(STAR_CHARS);s.style.left=2+Math.random()*96+"%";s.style.top=4+Math.random()*92+"%";s.style.fontSize=min+Math.random()*range+"px";s.style.setProperty("--speed",.45+Math.random()*1.3+"s");s.style.setProperty("--opacity",(.4+Math.random()*.55).toFixed(2));s.style.setProperty("--rot",Math.floor(Math.random()*360)+"deg");s.style.setProperty("--scale",(.7+Math.random()*.9).toFixed(2));return s}function addBubbleStars(el,n){el.querySelectorAll(":scope > .bubble-star").forEach(s=>s.remove());for(let i=0;i<n;i++)el.appendChild(makeStar("bubble-star",7,9))}function scatterBackgroundStars(){document.querySelectorAll(".pink-star").forEach(n=>n.remove());const w=innerWidth,h=innerHeight,n=Math.min(220,Math.floor(w*h/7000)),ui=document.querySelector(".wrap").getBoundingClientRect();for(let i=0,made=0;made<n&&i<n*12;i++){const x=Math.random()*w,y=Math.random()*h;if(x>ui.left-6&&x<ui.right+6)continue;const s=makeStar("pink-star",8,14);s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);made++}}document.querySelectorAll(".title-bubble,.creator-bubble,.panel").forEach(el=>addBubbleStars(el,12));scatterBackgroundStars();addEventListener("resize",()=>scatterBackgroundStars());
const canvas=$("game"),ctx=canvas.getContext("2d");let mouse={x:-100,y:-100},touchMode=false;function rectHit(o){return mouse.x>=o.x&&mouse.x<=o.x+o.w&&mouse.y>=o.y&&mouse.y<=o.y+o.h}function drawCircle(x,y,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}function drawBackground(){const g=ctx.createLinearGradient(0,0,0,215);g.addColorStop(0,"#1c1b2e");g.addColorStop(.7,"#3b3346");g.addColorStop(1,"#6b5a63");ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,215);drawCircle(820,60,26,"#f6ecd0");ctx.fillStyle="#71624f";ctx.fillRect(0,215,canvas.width,335);ctx.strokeStyle="#5b6266";for(let x=0;x<=canvas.width;x+=34){ctx.beginPath();ctx.moveTo(x,225);ctx.lineTo(x,330);ctx.stroke()}for(const [x,y,w,h] of [[0,170,95,45],[130,140,80,75],[245,175,135,40],[420,145,95,70],[560,182,115,33],[710,150,70,65],[810,130,90,85]]){ctx.fillStyle="#3f3a40";ctx.fillRect(x,y,w,h)}for(let i=0;i<28;i++){const x=18+i*57%860,y=355+i*47%160;ctx.fillStyle=i%2?"#4a443d":"#8d6843";ctx.fillRect(x,y,16,8)}}function drawTrashBag(o,hover){const{x,y,w,h}=o;ctx.fillStyle=hover?"#45464d":"#18191e";ctx.beginPath();ctx.ellipse(x+w/2,y+h*.62,w*.4,h*.36,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.42,y+h*.3);ctx.lineTo(x+w*.5,y+h*.08);ctx.lineTo(x+w*.58,y+h*.3);ctx.closePath();ctx.fill()}function drawBox(o,hover){ctx.fillStyle=hover?"#b18456":"#9a7248";ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle="#5f452d";ctx.strokeRect(o.x,o.y,o.w,o.h)}function drawCan(o,hover){ctx.fillStyle=hover?"#a6b2b5":"#919ea1";ctx.fillRect(o.x,o.y,o.w,o.h);ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y,o.w/2,8,0,0,Math.PI*2);ctx.fill()}function tileInfo(t){if(t.kind==="gift")return{e:ITEMS[t.id].e,ring:"#ffb347"};if(t.kind==="clue")return{e:FACTORS[t.f].clue.e,ring:"#5fd3b8"};if(t.kind==="vague")return{e:VAGUE.e,ring:"#5fd3b8"};return{e:t.j.e,ring:"#8c8c8c"}}function drawTiles(now){if(!S)return;S.tiles.forEach(t=>{const hover=!touchMode&&!t.open&&!overlayOpen&&S.digs>0&&rectHit(t);ctx.save();if(t.open)ctx.globalAlpha=.45;t.t==="bag"?drawTrashBag(t,hover):t.t==="box"?drawBox(t,hover):drawCan(t,hover);ctx.restore();if(hover){ctx.strokeStyle="#ffb6d9";ctx.lineWidth=3;ctx.strokeRect(t.x-5,t.y-5,t.w+10,t.h+10)}if(t.open){const info=tileInfo(t),cx=t.x+t.w/2,cy=t.y+t.h/2;drawCircle(cx,cy,32,"rgba(239,229,199,.95)",info.ring,4);ctx.font='36px "Segoe UI Emoji"';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(info.e,cx,cy)}else if(!overlayOpen&&S.digs>0){ctx.fillStyle="#ffb6d9";ctx.font="18px sans-serif";ctx.fillText("✦",t.x+t.w*.8,t.y+8)}})}function draw(now){ctx.clearRect(0,0,canvas.width,canvas.height);drawBackground();drawTiles(now);requestAnimationFrame(draw)}function updateMouse(e){const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*(canvas.width/r.width);mouse.y=(e.clientY-r.top)*(canvas.height/r.height)}canvas.addEventListener("pointermove",e=>{touchMode=e.pointerType==="touch";updateMouse(e)});canvas.addEventListener("pointerleave",()=>mouse={x:-100,y:-100});canvas.addEventListener("click",e=>{if(!S)return;updateMouse(e);const pad=touchMode?18:0,hit=[...S.tiles].reverse().find(t=>!t.open&&mouse.x>=t.x-pad&&mouse.x<=t.x+t.w+pad&&mouse.y>=t.y-pad&&mouse.y<=t.y+t.h+pad);if(hit)dig(hit)});
renderTimeStat();newGame();closeCard();showTitle();requestAnimationFrame(draw);
